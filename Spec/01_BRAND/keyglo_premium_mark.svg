<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 250 250">
    <defs>
      <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.55" stop-color="#e7edf2"/>
        <stop offset="1" stop-color="#aebbc6"/>
      </linearGradient>
      <linearGradient id="glo" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d55dff"/>
        <stop offset="0.45" stop-color="#a059ff"/>
        <stop offset="1" stop-color="#28ddff"/>
      </linearGradient>
      <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22ddff"/>
        <stop offset="0.45" stop-color="#7c42ff"/>
        <stop offset="1" stop-color="#d95bff"/>
      </linearGradient>
      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
